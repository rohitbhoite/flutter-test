name: core
description: "A new Flutter package project."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=1.17.0"



dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  retrofit: ^4.9.0
  json_annotation: ^4.9.0
  get_it: ^9.0.5
  go_router: ^17.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  clock: ^1.1.2
  # media_kit: ^1.2.2 # Primary package.
  # media_kit_video: ^2.0.0 # For video rendering.
  # media_kit_libs_video: ^1.0.7 # Native video dependencies.


dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  build_runner: ^2.10.4
  mocktail: ^1.0.4
  test: ^1.26.3 # ^1.27.0 causes issues with flutter_test
  bloc_test: ^10.0.0

